name: Anti-Gravity QA Automation Pipeline (1800 Test Cases)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, Run 6 QA Test Suites & Generate Reports
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          channel: 'stable'

      - name: Flutter Dependencies & Analyzer
        run: |
          flutter pub get
          flutter analyze || true

      - name: Run Core Flutter Unit Tests
        run: |
          flutter test --machine > test_results.json || true

      - name: Execute 1,800 Test Cases across 6 QA Categories
        run: |
          python tooling/qa_suite_runner.py

      - name: Upload Artifact: Selenium Web Report
        uses: actions/upload-artifact@v4
        with:
          name: selenium-web-report
          path: |
            selenium-web-report.md
            selenium-web-report/

      - name: Upload Artifact: Appium Android Report
        uses: actions/upload-artifact@v4
        with:
          name: appium-android-report
          path: |
            appium-android-report.md
            appium-android-report/

      - name: Upload Artifact: Unit Test Report
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            unit-test-report.md
            unit-test-report/

      - name: Upload Artifact: Validation Test Report
        uses: actions/upload-artifact@v4
        with:
          name: validation-test-report
          path: |
            validation-test-report.md
            validation-test-report/

      - name: Upload Artifact: Deployment Test Report
        uses: actions/upload-artifact@v4
        with:
          name: deployment-test-report
          path: |
            deployment-test-report.md
            deployment-test-report/

      - name: Upload Artifact: Load Test Report
        uses: actions/upload-artifact@v4
        with:
          name: load-test-report
          path: |
            load-test-report.md
            load-test-report/

      - name: Upload Artifact: Excel Master Test Report (1800 Test Cases)
        uses: actions/upload-artifact@v4
        with:
          name: excel-master-test-report
          path: test_report.xlsx
